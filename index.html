<!-- SECCIÓN DE PRODUCTIVIDAD Y AGUA -->
<div class="card">
    <h3>Día Productivo</h3>
    <div class="star-rating" id="productivityStars">
        <span data-value="1">★</span>
        <span data-value="2">★</span>
        <span data-value="3">★</span>
        <span data-value="4">★</span>
        <span data-value="5">★</span>
    </div>
</div>

<div class="card">
    <h3>Agua Consumida</h3>
    <input type="number" id="waterInput" placeholder="Ej. 2500 (ml) o vasos">
</div>

<!-- SECCIÓN DE EJERCICIO MÚLTIPLE -->
<div class="card">
    <h3>Ejercicio</h3>
    <div id="exerciseList">
        <div class="exercise-item">
            <input type="text" placeholder="Actividad (Ej. Caminata / Pesas)">
            <input type="text" placeholder="Condición (Ej. Zona 2 / Intenso)">
        </div>
    </div>
    <button onclick="addExerciseField()">+ Añadir otro ejercicio</button>
</div>

<!-- TOP 3 GOALS -->
<div class="card">
    <h3>Top 3 Goals</h3>
    <div id="topGoalsContainer">
        <div class="goal-row"><input type="checkbox"> <input type="text" placeholder="Meta 1"><button>❌</button></div>
        <div class="goal-row"><input type="checkbox"> <input type="text" placeholder="Meta 2"><button>❌</button></div>
        <div class="goal-row"><input type="checkbox"> <input type="text" placeholder="Meta 3"><button>❌</button></div>
    </div>
</div>

<!-- RUTINA DE NOCHE -->
<div class="card">
    <h3>Rutina de Noche</h3>
    <div id="nightRoutineList">
        <div class="habit-fixed"><input type="checkbox"> Skincare nocturno</div>
        <div class="habit-fixed"><input type="checkbox"> Preparar día siguiente</div>
    </div>
    <button onclick="addNightHabit()">+ Añadir hábito</button>
</div>

<!-- SCHEDULE POR BLOQUES HORARIOS -->
<div class="card">
    <h3>Schedule</h3>
    <div id="scheduleContainer">
        <div class="time-slot"><span>05:00 - 06:00</span> <input type="text" placeholder="¿Qué harás aquí?"></div>
        <div class="time-slot"><span>06:00 - 07:00</span> <input type="text" placeholder="¿Qué harás aquí?"></div>
        <div class="time-slot"><span>07:00 - 08:00</span> <input type="text" placeholder="¿Qué harás aquí?"></div>
    </div>
</div>
